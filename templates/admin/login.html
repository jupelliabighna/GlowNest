<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | GlowNest</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <h1>GlowNest Admin</h1>

            <p>
                Sign in to manage appointments.
            </p>

            {% if error %}
                <p class="login-error">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST">
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Sign In
                </button>

            </form>

        </div>

    </main>

</body>

</html>
